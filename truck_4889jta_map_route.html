    // 1. Initialize Leaflet Map

      attribution: '&copy; Google Maps Satellite'
    });

    document.getElementById('btnStreets').onclick = () => {
      map.removeLayer(satLayer);
      streetLayer.addTo(map);
      document.getElementById('btnStreets').className = 'px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold shadow transition cursor-pointer';

        </svg>
      </div>
    `;

    const customPinIcon = L.divIcon({

      className: 'tb5-breadcrumb-marker',
      iconSize: [18, 24],
      iconAnchor: [9, 24]
    });

    routePoints.forEach((pt, idx) => {

          <div class="font-bold text-slate-900 border-b pb-1 mb-1 flex items-center justify-between gap-2">
            <span>Ping #${idx + 1}</span>

          <div class="text-slate-600"><strong>Time:</strong> ${pt.time}</div>

          <div class="text-slate-600"><strong>Ignition:</strong> ${pt.ign} (${pt.battery}V)</div>
        </div>
      `);
      waypointMarkers.push(marker);
    });

    // 4. Draw Green Truck Icon at Current/Latest Position (Al Henakiyah)
    const lastPt = routePoints[routePoints.length - 1];

    function createTruckIcon(headingDeg) {
      const truckSvg = `
        <div class="relative flex items-center justify-center cursor-pointer" style="width: 44px; height: 44px; transform: translate(-50%, -50%);">
          <div class="truck-pulse-ring"></div>
          <div class="w-10 h-10 rounded-full bg-emerald-600 border-2 border-white shadow-2xl flex items-center justify-center text-white text-lg transition-transform" style="transform: rotate(${headingDeg}deg);">

          </div>
          <div class="absolute -bottom-5 whitespace-nowrap bg-slate-900 text-white font-mono font-bold text-[10px] px-1.5 py-0.5 rounded shadow border border-slate-700 pointer-events-none">
            4889 JTA
          </div>
        </div>
      `;
      return L.divIcon({
        html: truckSvg,
        className: 'current-truck-marker',
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });
    }

    const truckMarker = L.marker([lastPt.lat, lastPt.lng], {
      icon: createTruckIcon(lastPt.heading || 240),
      zIndexOffset: 2000

    truckMarker.bindPopup(`
      <div class="p-2 text-xs font-sans">
        <div class="font-black text-slate-900 text-sm border-b pb-1 mb-1">Truck 4889 JTA (Asset 268)</div>
        <div class="text-slate-700"><strong>Location:</strong> Route 60 near Al Henakiyah</div>

    // 5. Interactive Scrubber & Replay Functionality
    const slider = document.getElementById('routeSlider');
    const timeDisplay = document.getElementById('currentTimestamp');
    const speedDisplay = document.getElementById('topSpeed');
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');

    function updateToPoint(idx) {
      const pt = routePoints[idx];
      truckMarker.setLatLng([pt.lat, pt.lng]);
      truckMarker.setIcon(createTruckIcon(pt.heading || 240));
      timeDisplay.innerText = pt.time;
      speedDisplay.innerHTML = `${pt.speed} <span class="text-xs font-normal">km/h</span>`;
    }

    slider.oninput = (e) => {
      updateToPoint(parseInt(e.target.value, 10));
    };

    let isPlaying = false;
    let playInterval = null;

    btnPlay.onclick = () => {
      if (isPlaying) {
        clearInterval(playInterval);
        isPlaying = false;
        playIcon.innerText = '▶';
        playText.innerText = 'Replay Route';
      } else {
        isPlaying = true;
        playIcon.innerText = '⏸';
        playText.innerText = 'Pause';
        
        // If at the end, start from 0
        if (parseInt(slider.value, 10) >= routePoints.length - 1) {
          slider.value = 0;
        }

        playInterval = setInterval(() => {
          let cur = parseInt(slider.value, 10);
          if (cur >= routePoints.length - 1) {
            clearInterval(playInterval);
            isPlaying = false;
            playIcon.innerText = '▶';
            playText.innerText = 'Replay Route';
            return;
          }
          cur += 2;
          if (cur > routePoints.length - 1) cur = routePoints.length - 1;

          updateToPoint(cur);
        }, 60);
      }
